const wisdom=[["今天稱為「拜占庭帝國」的國家，其居民普遍如何理解自己的政治身分？",["羅馬人","維京人","法蘭克人","波斯人"],0],["歷史上的君士坦丁堡，主要對應今天哪座城市？",["伊斯坦堡","雅典","安卡拉","索菲亞"],0],["現存聖索菲亞大教堂的主要建築，是在哪位拜占庭皇帝統治時建成？",["君士坦丁一世","狄奧多西一世","查士丁尼一世","巴西爾二世"],2],["維京長船吃水較淺，帶來哪項重要優勢？",["能完全潛入水下","不需要船槳或風帆","能抵擋所有海浪","能沿河流深入內陸並靠近淺灘"],3],["著名的《貝葉掛毯》嚴格來說，主要是用哪種工藝製作？",["在亞麻布上刺繡","將羊毛毯壓成圖案","把彩色布片黏貼成畫","以金屬絲編織"],0],["1066 年黑斯廷斯戰役後，征服英格蘭的是誰？",["獅心王理查","諾曼第公爵威廉","查理曼","亨利八世"],1],["1215 年《大憲章》誕生時，受到貴族施壓的英格蘭國王是誰？",["愛德華一世","約翰王","理查三世","亨利五世"],1],["近世歐洲部分瘟疫醫生的鳥嘴面罩，會在突出部位填入什麼？",["火藥","冰塊","金屬碎片","芳香草藥與香料"],3],["歐洲中世紀手抄本常用的羊皮紙，主要由什麼材料製成？",["羊毛","木漿","經處理的動物皮","亞麻纖維"],2],["歷史文獻研究中的「重寫本」，指的是哪一種手稿？",["刮除或洗去原文字後，再寫上新內容的手稿","同一作者重新出版的書","用兩種語言同時書寫的書","只剩封面的古書"],0],["聖女貞德的軍事活動，主要發生在哪場戰爭期間？",["英法百年戰爭","三十年戰爭","七年戰爭","西班牙王位繼承戰爭"],0],["1492 年，伊比利半島上最後一個穆斯林王國的首都陷落，這座城市是哪裡？",["里斯本","巴塞隆納","馬德里","格拉納達"],3],["哥倫布 1492 年首次橫越大西洋後，最先登陸的地區一般認為位於哪裡？",["加拿大東岸","巴哈馬群島","巴西海岸","阿根廷南端"],1],["科學家牛頓晚年曾長期在哪個機構任職，並參與打擊偽幣？",["格林威治天文台","英國皇家鑄幣廠","東印度公司","大英博物館"],1],["俄羅斯的聖彼得堡，是由哪位統治者下令建立？",["伊凡四世","尼古拉二世","亞歷山大二世","彼得大帝"],3],["俄羅斯女皇凱薩琳二世在嫁入俄國皇室之前，出身於哪種背景？",["法國商人家庭","西班牙王室","德意志地區的王公家族","瑞典農民家庭"],2],["拿破崙 1814 年第一次退位後，被送往哪座島嶼？",["聖赫勒拿島","科西嘉島","厄爾巴島","馬爾他島"],2],["1803 年，美國透過路易斯安那購地案，向哪個國家購買大片領土？",["英國","西班牙","荷蘭","法國"],3],["海地革命與 1804 年獨立，最鮮明的歷史特色是什麼？",["被奴役者的起義最終促成獨立國家","由北歐移民建立王國","透過購買整座島嶼建國","由羅馬教宗直接授予獨立"],0],["波士頓茶葉事件中，被倒入港內的茶葉屬於哪家公司？",["英國東印度公司","荷蘭東印度公司","哈德遜灣公司","法國西印度公司"],0],["1814 年，美國白宮遭哪一國軍隊焚燒？",["法國","英國","西班牙","墨西哥"],1],["鐵達尼號沉沒後，接走救生艇上生還者的主要救援船是哪一艘？",["喀爾巴阡號","奧林匹克號","不列顛號","茅利塔尼亞號"],0],["達爾文進行著名考察航行時，搭乘的船隻是哪一艘？",["奮進號","小獵犬號","勝利號","發現號"],1],["南丁格爾因戰地護理工作而聲名大噪，主要與哪場戰爭有關？",["普法戰爭","美國南北戰爭","克里米亞戰爭","日俄戰爭"],2],["亨利杜南目睹戰場救護的傷兵慘況後，推動了日後紅十字運動的誕生，這場戰役是？",["滑鐵盧戰役","奧斯特利茨戰役","索爾費里諾戰役","色當戰役"],2],["1869 年通航的蘇伊士運河，直接連接哪兩片海域？",["黑海與愛琴海","波羅的海與北海","地中海與黑海","地中海與紅海"],3]];
const knowledge=[["《讓子彈飛》中，「晚了！前幾任縣長把鵝城的稅收到九十年以後了。」出自哪部作品？",["《讓子彈飛》"],0,false],["【台詞猜作品】「路？我們要去的地方，不需要路。」出自哪部作品？",["《比爾和泰德歷險記》","《時光機器》","《回到未來》","《MIB星際戰警》"],2,true],["【台詞猜作品】「假如再也見不到你，祝你午安、晚安。」出自哪部作品？",["《王牌冤家》","《楚門的世界》","《命運好好玩》","《王牌天神》"],1,true],["【台詞猜作品】「做人如果沒有夢想，跟鹹魚有什麼分別？」出自哪部作品？",["《喜劇之王》","《少林足球》","《食神》","《破壞之王》"],1,true],["《新世紀福音戰士》中，渚薰在最深處最終發現，被固定在十字架上的是誰？",["莉莉絲","亞當","夏娃","卡斯柏"],0,true],["《刺激一九九五》中，安迪越獄時洞口被哪位明星的海報遮住？",["麗塔・海華絲","瑪麗蓮・夢露","拉寇兒・薇芝","伊莉莎白・泰勒"],2,true],["【台詞猜作品】「人類真是簡單。」出自哪部作品？",["《SPY×FAMILY 間諜家家酒》","《殺手奶爸》","《日常》","《超能力女兒》"],0,true],["《航海王》中，布魯克原屬倫巴海賊團的船長是誰？",["克洛卡斯","約奇","培羅娜","海格"],1,true],["《火影忍者》中，迪達拉特別訓練用來抵抗幻術的是哪隻眼睛？",["左眼","右眼","雙眼","沒有"],0,true],["《新世紀福音戰士》中，初號機的核心與哪位角色的靈魂有關？",["赤木直子","綾波零","葛城美里","碇唯"],3,true],["【台詞猜作品】「這就叫作詐騙，親愛的。」出自哪部作品？",["《歡樂好聲音》","《動物方城市》","《壞蛋聯盟》","《寵物當家》"],1,true]];
let tab=location.hash==='#wisdom'?'wisdom':'knowledge';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
function draw(){const questions=tab==='knowledge'?knowledge:wisdom;const q=norm($('query').value);const matches=questions.map((v,i)=>({v,i})).filter(({v})=>!q||norm(v[0]+' '+v[1].join(' ')).includes(q));$('summary').textContent=(tab==='knowledge'?'知識王題庫':'三轉智慧問答題庫')+'・共 '+questions.length+' 題・符合 '+matches.length+' 題';$('results').innerHTML=matches.length?matches.map(({v,i})=>'<article class="card"><div class="num">第 '+(i+1)+' 題</div><div class="question">'+esc(v[0])+'</div><div class="choices">'+v[1].map((answer,n)=>'<div class="choice '+(n===v[2]?'correct':'')+'">'+String.fromCharCode(65+n)+'　'+(n===v[2]?'✅ ':'')+esc(answer)+'</div>').join('')+'</div>'+(tab==='knowledge'&&v[3]===false?'<div class="note">此題的原始選項未完整保留，僅列出目前確認的正確答案。</div>':'')+'</article>').join(''):'<div class="empty">沒有符合的題目</div>'}
$('tabKnowledge').onclick=()=>{tab='knowledge';location.hash='knowledge';$('tabKnowledge').classList.add('active');$('tabWisdom').classList.remove('active');draw()};
$('tabWisdom').onclick=()=>{tab='wisdom';location.hash='wisdom';$('tabWisdom').classList.add('active');$('tabKnowledge').classList.remove('active');draw()};
$('query').oninput=draw;if(tab==='wisdom'){$('tabKnowledge').classList.remove('active');$('tabWisdom').classList.add('active')}draw();
</script></body></html>
