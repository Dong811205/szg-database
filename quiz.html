let tab=location.hash==='#wisdom'?'wisdom':'knowledge';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
function draw(){const questions=tab==='knowledge'?knowledge:wisdom;const q=norm($('query').value);const matches=questions.map((v,i)=>({v,i})).filter(({v})=>!q||norm(v[0]).includes(q));$('summary').textContent=(tab==='knowledge'?'知識王題庫':'三轉智慧問答題庫')+'・共 '+questions.length+' 題・符合 '+matches.length+' 題';$('results').innerHTML=matches.length?matches.map(({v,i})=>'<article class="card"><div class="num">第 '+(i+1)+' 題</div><div class="question">'+esc(v[0])+'</div><div class="choices">'+v[1].map((answer,n)=>'<div class="choice '+(n===v[2]?'correct':'')+'">'+(n===v[2]?'✅ ':'')+String.fromCharCode(65+n)+'　'+esc(answer)+'</div>').join('')+'</div>'+(tab==='knowledge'&&v[4]?'<div class="note">分類：'+esc(v[4])+(v[5]?'｜'+esc(v[5]):'')+'</div>':'')+(tab==='knowledge'&&v[3]===false?'<div class="note">此題的原始選項未完整保留，僅列出目前確認的正確答案。</div>':'')+'</article>').join(''):'<div class="empty">沒有符合的題目</div>'}
$('tabKnowledge').onclick=()=>{tab='knowledge';location.hash='knowledge';$('tabKnowledge').classList.add('active');$('tabWisdom').classList.remove('active');draw()};
$('tabWisdom').onclick=()=>{tab='wisdom';location.hash='wisdom';$('tabWisdom').classList.add('active');$('tabKnowledge').classList.remove('active');draw()};
$('query').oninput=draw;if(tab==='wisdom'){$('tabKnowledge').classList.remove('active');$('tabWisdom').classList.add('active')}draw();
</script></body></html>
