'use strict';const DATA=JSON.parse(document.getElementById('data').textContent);const allItems=DATA.items;const mobs=DATA.mobs;const itemMap=new Map(allItems.map(i=>[i.id,i]));const mobEntries=Object.entries(mobs).map(([id,m])=>({id,...m}));const byItem=new Map(),byMob=new Map();for(const [mid,iid,loc] of DATA.links){if(!byItem.has(iid))byItem.set(iid,[]);if(!byMob.has(mid))byMob.set(mid,[]);byItem.get(iid).push([mid,loc]);byMob.get(mid).push([iid,loc]);}
const $=id=>document.getElementById(id);let mode='item',page=0;const batch=35;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function normalize(s){return String(s||'').toLocaleLowerCase('zh-Hant').replace(/\s+/g,'').replace(/卷軸/g,'卷').replace(/％/g,'%')};function findList(){const q=normalize($('search').value),filter=$('filter').value,only=$('onlyDrops').checked;if(mode==='item')return allItems.filter(i=>(filter==='all'||(filter==='道具'?!['裝備','卷軸'].includes(i.type):i.type===filter))&&(!only||byItem.has(i.id))&&(!q||normalize([i.name,i.equipCategory,i.job,i.gender].filter(Boolean).join(' ')).includes(q))).sort((a,b)=>(b.name===q)-(a.name===q)||(byItem.has(b.id)?1:0)-(byItem.has(a.id)?1:0)||a.name.localeCompare(b.name,'zh-Hant'));return mobEntries.filter(m=>(!q||normalize(m.name).includes(q))&&(!only||byMob.has(m.id))).sort((a,b)=>(b.name===q)-(a.name===q)||(a.level??999)-(b.level??999)||a.name.localeCompare(b.name,'zh-Hant'));}
function setMode(next,q=''){mode=next;$('itemTab').classList.toggle('active',mode==='item');$('mobTab').classList.toggle('active',mode==='mob');$('filter').hidden=mode==='mob';$('filterLabel').hidden=mode==='mob';$('search').placeholder=mode==='item'?'例如：手套攻擊、褲裙敏捷、提督上衣':'例如：咕咕鐘、沼澤巨鱷、雪毛怪人';$('search').value=q;page=0;render();$('search').focus()};function openOther(next,q){setMode(next,q);window.scrollTo({top:0,behavior:'smooth'})};
function equipTags(i){if(i.type!=='裝備')return '';const j=i.job||'職業未註明',g=i.gender||'性別未註明';const t=i.equipCategory||'其他裝備';return `<div class="equipTags"><span class="tag weaponType">${esc(t)}</span><span class="tag job">${esc(j)}</span><span class="tag gender ${g==='女限定'?'female':g==='男限定'?'male':''}">${esc(g)}</span></div>`;}

function renderItem(i){const rows=byItem.get(i.id)||[];const distinct=[...new Map(rows.map(([mid,loc])=>[mid+'|'+loc,[mid,loc]])).values()].sort((a,b)=>(mobs[a[0]]?.level??999)-(mobs[b[0]]?.level??999));return `<article class="result"><div class="resultHead"><div><span class="name">${esc(i.name)}</span><span class="tag ${i.type==='卷軸'?'scroll':''}">${esc(i.type)}</span>${equipTags(i)}<div class="details">${esc(tinyInfo(i))}</div></div><span class="hint">${new Set(rows.map(r=>r[0])).size} 種怪物</span></div><div class="subhead">掉落怪物 ${rows.length?'· 點擊名稱反向查詢':'· 目前資料未查到'}</div>${rows.length?`<div class="dropRows">${distinct.map(([mid,loc])=>{const m=mobs[mid]||{};return `<div class="drop"><div class="dropText">${esc(m.name)}<div class="meta">${m.level!=null?'Lv.'+m.level+'｜':''}${loc?'<span class="map">指定地圖：'+esc(loc)+'</span>':'一般掉落'}</div></div><button class="action goMob" data-name="${esc(m.name)}">看掉落</button></div>`}).join('')}</div>`:'<div class="empty">這份資料沒有列出此物品的掉落來源</div>'}</article>`}
function renderMob(m){const rows=byMob.get(m.id)||[];const grouped=new Map();for(const [iid,loc] of rows){const k=iid+'|'+loc;if(!grouped.has(k))grouped.set(k,[iid,loc])}const show=[...grouped.values()].sort((a,b)=>{const ta=itemMap.get(a[0])?.type||'',tb=itemMap.get(b[0])?.type||'';const rank={'裝備':0,'卷軸':1,'道具':2,'楓幣':3};return (rank[ta]??2)-(rank[tb]??2)||(itemMap.get(a[0])?.name||'').localeCompare(itemMap.get(b[0])?.name||'','zh-Hant')});const mapinfo=m.maps?.length?`<div class="meta">出現地圖：${esc(m.maps.join('、'))}${m.maps.length>=16?'…':''}</div>`:'';return `<article class="result"><div class="resultHead"><div><span class="name">${esc(m.name)}</span><span class="tag mob">${m.level!=null?'Lv.'+m.level:'等級未提供'}</span>${mapinfo}</div><span class="hint">${new Set(rows.map(r=>r[0])).size} 種掉落</span></div><div class="subhead">已列出的掉落物品 ${rows.length?'· 點擊物品反向查詢':'· 目前資料未查到'}</div>${rows.length?`<div class="dropRows">${show.map(([iid,loc])=>{const i=itemMap.get(iid)||{name:'未收錄物品',type:'道具'};return `<div class="drop"><div class="dropText">${esc(i.name)}<span class="tag ${i.type==='卷軸'?'scroll':''}">${esc(i.type)}</span>${equipTags(i)}<div class="meta">${loc?'<span class="map">指定地圖：'+esc(loc)+'</span>｜':''}${esc(tinyInfo(i))}</div></div><button class="action goItem" data-id="${iid}">看來源</button></div>`}).join('')}</div>`:'<div class="empty">這份資料沒有列出此怪物的掉落物品</div>'}</article>`}
function render(){const data=findList();$('version').textContent=`資料更新 ${DATA.meta.date} · ${DATA.meta.equips} 件裝備 · ${DATA.meta.scrolls} 種卷軸`;$('count').textContent=`找到 ${data.length.toLocaleString()} ${mode==='item'?'項物品':'種怪物'}`;$('subtitle').textContent=mode==='item'?'物品 → 怪物':'怪物 → 掉落物';let max=(page+1)*batch;$('results').innerHTML=data.length?data.slice(0,max).map(mode==='item'?renderItem:renderMob).join(''):'<div class="empty">沒有符合的資料，可以試試較短的關鍵字。</div>';$('more').hidden=data.length<=max;$('more').textContent=`顯示更多（尚有 ${Math.max(0,data.length-max).toLocaleString()} 筆）`};
