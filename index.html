:"https://play.szg08.com/legacy/assets/world/mob_8200001.png","8220001":"https://play.szg08.com/game/boss-world/mob_8220001.png","9000001":"https://play.szg08.com/game/trials/mob_9000001.png","9000002":"https://play.szg08.com/game/trials/mob_9000002.png","9000100":"https://play.szg08.com/game/trials/mob_9000100.png","9000101":"https://play.szg08.com/game/trials/mob_9000101.png","9000200":"https://play.szg08.com/game/trials/mob_9000200.png","9000201":"https://play.szg08.com/game/trials/mob_9000201.png","9000300":"https://play.szg08.com/game/trials/mob_9000300.png","9000301":"https://play.szg08.com/game/trials/mob_9000301.png","9001000":"https://play.szg08.com/game/trials/mob_9001000.png","9001001":"https://play.szg08.com/game/nov03-items/grendel-clean.gif","9001002":"https://play.szg08.com/game/trials/mob_9001002.png","9001003":"https://play.szg08.com/game/trials/mob_9001003.png","9001004":"https://play.szg08.com/game/trials/mob_9001004.png","9001005":"https://play.szg08.com/game/trials/mob_9001005.png","9001006":"https://play.szg08.com/game/trials/mob_9001006.png","9001008":"https://play.szg08.com/game/monster-actions/9001008-stand.png","9300006":"https://play.szg08.com/game/eight-bosses/ludi/mob_9300006.png","9300012":"https://play.szg08.com/game/eight-bosses/ludi/mob_9300012.png","9300015":"https://play.szg08.com/game/eight-bosses/ludi/mob_3230306.png","9300017":"https://play.szg08.com/game/seven-maps/4230115-stand.png"}}</script><script>
'use strict';const DATA=JSON.parse(document.getElementById('data').textContent);const allItems=DATA.items;const mobs=DATA.mobs;const itemMap=new Map(allItems.map(i=>[i.id,i]));const IMAGES=JSON.parse(document.getElementById('images').textContent);const pic=(src,alt,cls='')=>src?`<img class="lookup-pic ${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async" onerror="this.hidden=true" />`:'';const itemPic=i=>pic(IMAGES.items[i.id],i.name,'item-pic');const mobPic=(id,m)=>pic(IMAGES.mobs[id],m.name,'mob-pic');const mobEntries=Object.entries(mobs).map(([id,m])=>({id,...m}));const byItem=new Map(),byMob=new Map();for(const [mid,iid,loc] of DATA.links){if(!byItem.has(iid))byItem.set(iid,[]);if(!byMob.has(mid))byMob.set(mid,[]);byItem.get(iid).push([mid,loc]);byMob.get(mid).push([iid,loc]);}
const $=id=>document.getElementById(id);let mode='item',page=0;const batch=35;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function normalize(s){return String(s||'').toLocaleLowerCase('zh-Hant').replace(/\s+/g,'').replace(/卷軸/g,'卷').replace(/％/g,'%')};function displayType(i){if(i.type==='裝備'||i.type==='卷軸'||i.type==='楓幣')return i.type;const n=Number(i.id)||0;if(n>=2000000&&n<2060000)return n>=2040000&&n<2050000?'卷軸':'消耗品';if(n>=2060000&&n<2070000)return '箭矢';if(n>=2070000&&n<2080000)return '飛鏢';if(n>=2330000&&n<2340000)return '子彈';if(n>=2280000&&n<2300000)return '技能書';if(n>=4000000&&n<5000000)return '材料';return '其他道具'}
function findList(){const q=normalize($('search').value),filter=$('filter').value,only=$('onlyDrops').checked;if(mode==='item')return allItems.filter(i=>(filter==='all'||displayType(i)===filter)&&(!only||byItem.has(i.id))&&(!q||normalize([i.name,i.equipCategory,i.job,i.gender,displayType(i)].filter(Boolean).join(' ')).includes(q))).sort((a,b)=>(b.name===q)-(a.name===q)||(byItem.has(b.id)?1:0)-(byItem.has(a.id)?1:0)||a.name.localeCompare(b.name,'zh-Hant'));return mobEntries.filter(m=>(!q||normalize(m.name).includes(q))&&(!only||byMob.has(m.id))).sort((a,b)=>(b.name===q)-(a.name===q)||(a.level??999)-(b.level??999)||a.name.localeCompare(b.name,'zh-Hant'));}
function setMode(next,q=''){mode=next;$('itemTab').classList.toggle('active',mode==='item');$('mobTab').classList.toggle('active',mode==='mob');$('filter').hidden=mode==='mob';$('filterLabel').hidden=mode==='mob';$('search').placeholder=mode==='item'?'例如：手套攻擊、褲裙敏捷、提督上衣':'例如：咕咕鐘、沼澤巨鱷、雪毛怪人';$('search').value=q;page=0;render();$('search').focus()};function openOther(next,q){setMode(next,q);window.scrollTo({top:0,behavior:'smooth'})};
function iconFor(i,kind='item'){const src=i?.image;if(!src)return '';if(!(src.startsWith('https://play.szg08.com/')||src.startsWith('data:image/png;base64,')))return '';return '<img class="gameIcon '+(kind==='mob'?'mobIcon':'')+'" src="'+esc(src)+'" loading="lazy" decoding="async" alt="" onerror="this.style.display=\'none\'">';}
function equipTags(i){if(i.type!=='裝備')return '';const j=i.job||'職業未註明',g=i.gender||'性別未註明';const t=i.equipCategory||'其他裝備';return `<div class="equipTags"><span class="tag weaponType">${esc(t)}</span><span class="tag job">${esc(j)}</span><span class="tag gender ${g==='女限定'?'female':g==='男限定'?'male':''}">${esc(g)}</span></div>`;}
function tinyInfo(i){const parts=[];if(i.type==='裝備'){if(i.level!=null)parts.push('Lv.'+i.level);if(i.slots!=null)parts.push('衝卷次數 '+i.slots)}if(i.type==='卷軸'&&i.rate!=null)parts.push('成功率 '+i.rate+'%');if(i.detail)parts.push(i.detail);return parts.join('｜')||i.description||'無其他能力資料'};
function renderItem(i){const rows=byItem.get(i.id)||[];const distinct=[...new Map(rows.map(([mid,loc])=>[mid+'|'+loc,[mid,loc]])).values()].sort((a,b)=>(mobs[a[0]]?.level??999)-(mobs[b[0]]?.level??999));return `<article class="result"><div class="resultHead"><div>${itemPic(i)||iconFor(i)}<span class="name">${esc(i.name)}</span><span class="tag ${i.type==='卷軸'?'scroll':''}">${esc(displayType(i))}</span>${equipTags(i)}<div class="details">${esc(tinyInfo(i))}</div></div><span class="hint">${new Set(rows.map(r=>r[0])).size} 種怪物</span></div><div class="subhead">掉落怪物 ${rows.length?'· 點擊名稱反向查詢':'· 目前資料未查到'}</div>${rows.length?`<div class="dropRows">${distinct.map(([mid,loc])=>{const m=mobs[mid]||{};return `<div class="drop"><div class="dropText">${mobPic(mid,m)}${esc(m.name)}<div class="meta">${m.level!=null?'Lv.'+m.level+'｜':''}${loc?'<span class="map">指定地圖：'+esc(loc)+'</span>':'一般掉落'}</div></div><button class="action goMob" data-name="${esc(m.name)}">看掉落</button></div>`}).join('')}</div>`:'<div class="empty">這份資料沒有列出此物品的掉落來源</div>'}</article>`}
function renderMob(m){const rows=byMob.get(m.id)||[];const grouped=new Map();for(const [iid,loc] of rows){const k=iid+'|'+loc;if(!grouped.has(k))grouped.set(k,[iid,loc])}const show=[...grouped.values()].sort((a,b)=>{const ta=displayType(itemMap.get(a[0])||{}),tb=displayType(itemMap.get(b[0])||{});const rank={'裝備':0,'卷軸':1,'消耗品':2,'箭矢':3,'飛鏢':3,'子彈':3,'技能書':4,'材料':5,'其他道具':6,'楓幣':7};return (rank[ta]??2)-(rank[tb]??2)||(itemMap.get(a[0])?.name||'').localeCompare(itemMap.get(b[0])?.name||'','zh-Hant')});const mapinfo=m.maps?.length?`<div class="meta">出現地圖：${esc(m.maps.join('、'))}${m.maps.length>=16?'…':''}</div>`:'';return `<article class="result"><div class="resultHead"><div>${mobPic(m.id,m)||iconFor(m,"mob")}<span class="name">${esc(m.name)}</span><span class="tag mob">${m.level!=null?'Lv.'+m.level:'等級未提供'}</span>${mapinfo}</div><span class="hint">${new Set(rows.map(r=>r[0])).size} 種掉落</span></div><div class="subhead">已列出的掉落物品 ${rows.length?'· 點擊物品反向查詢':'· 目前資料未查到'}</div>${rows.length?`<div class="dropRows">${show.map(([iid,loc])=>{const i=itemMap.get(iid)||{name:'未收錄物品',type:'道具'};return `<div class="drop"><div class="dropText">${itemPic(i)}${esc(i.name)}<span class="tag ${i.type==='卷軸'?'scroll':''}">${esc(displayType(i))}</span>${equipTags(i)}<div class="meta">${loc?'<span class="map">指定地圖：'+esc(loc)+'</span>｜':''}${esc(tinyInfo(i))}</div></div><button class="action goItem" data-id="${iid}">看來源</button></div>`}).join('')}</div>`:'<div class="empty">這份資料沒有列出此怪物的掉落物品</div>'}</article>`}
function render(){const data=findList();$('version').textContent=`資料更新 ${DATA.meta.date} · ${DATA.meta.equips} 件裝備 · ${DATA.meta.scrolls} 種卷軸`;$('count').textContent=`找到 ${data.length.toLocaleString()} ${mode==='item'?'項物品':'種怪物'}`;$('subtitle').textContent=mode==='item'?'物品 → 怪物':'怪物 → 掉落物';let max=(page+1)*batch;$('results').innerHTML=data.length?data.slice(0,max).map(mode==='item'?renderItem:renderMob).join(''):'<div class="empty">沒有符合的資料，可以試試較短的關鍵字。</div>';$('more').hidden=data.length<=max;$('more').textContent=`顯示更多（尚有 ${Math.max(0,data.length-max).toLocaleString()} 筆）`};
$('itemTab').onclick=()=>setMode('item');$('mobTab').onclick=()=>setMode('mob');$('search').addEventListener('input',()=>{page=0;render()});$('filter').onchange=()=>{page=0;render()};$('onlyDrops').onchange=()=>{page=0;render()};$('clear').onclick=()=>{$('search').value='';page=0;render();$('search').focus()};$('more').onclick=()=>{page++;render()};$('results').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('goMob'))openOther('mob',b.dataset.name);if(b.classList.contains('goItem'))openOther('item',itemMap.get(Number(b.dataset.id))?.name||'')});render();
</script></body></html>
